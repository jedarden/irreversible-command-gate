[package]
name = "bead-integrity-check"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.32", features = ["bundled"] }
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
git2 = "0.18"
tempfile = "3.10"
colored_json = "4.0"

[[bin]]
name = "bead-integrity-check"
path = "src/main.rs"
