[package]
name = "icg"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
regex = "1.11"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1.40", features = ["full"] }
thiserror = "1.0"
uuid = { version = "1.11", features = ["v4"] }
libc = "0.2"
async-trait = "0.1"
flate2 = "1.1"
tar = "0.4"

# Bead dependency validator dependencies
rusqlite = { version = "0.32", features = ["bundled"] }

[[bin]]
name = "frontier-consistency-check"
path = "src/bin/frontier-consistency-check.rs"

[[bin]]
name = "checkpoint-monitor"
path = "src/bin/checkpoint-monitor.rs"

[[bin]]
name = "pluck-query-debugger"
path = "src/bin/pluck-query-debugger.rs"

[[bin]]
name = "starvation-diagnostic"
path = "src/bin/starvation-diagnostic.rs"

[dev-dependencies]
tempfile = "3.13"
