---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bead-integrity-monitor
  namespace: bead-integrity-monitor
  labels:
    app: bead-integrity-monitor
    component: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bead-integrity-monitor
  template:
    metadata:
      labels:
        app: bead-integrity-monitor
        component: monitoring
    spec:
      serviceAccountName: bead-integrity-monitor
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: monitor
        image: ronaldraygun/bead-integrity-monitor:0.1.0
        imagePullPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        env:
        - name: ICG_WORKSPACE_PATH
          value: /workspace
        - name: ICG_CHECK_INTERVAL_SECONDS
          value: "300"
        - name: ICG_ALERT_THRESHOLD
          value: "10"
        - name: ICG_AUTO_REPAIR_ENABLED
          value: "true"
        - name: ICG_MONITOR_HOST
          value: "0.0.0.0"
        - name: ICG_MONITOR_PORT
          value: "9095"
        ports:
        - name: http
          containerPort: 9095
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /health/live
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health/ready
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        volumeMounts:
        - name: workspace
          mountPath: /workspace
          readOnly: false
        - name: diagnostics
          mountPath: /workspace/.beads/diagnostics
      volumes:
      - name: workspace
        persistentVolumeClaim:
          claimName: bead-workspace-pvc
          readOnly: false
      - name: diagnostics
        emptyDir:
          sizeLimit: 100Mi
---
apiVersion: v1
kind: Service
metadata:
  name: bead-integrity-monitor
  namespace: bead-integrity-monitor
  labels:
    app: bead-integrity-monitor
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 9095
    targetPort: http
    protocol: TCP
  selector:
    app: bead-integrity-monitor
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bead-integrity-monitor
  namespace: bead-integrity-monitor
automountServiceAccountToken: false
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bead-workspace-pvc
  namespace: bead-integrity-monitor
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: sata
---
