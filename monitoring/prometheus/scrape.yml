# Merge this job into the existing Prometheus configuration.  The target is
# intentionally a placeholder: use the Service/host that runs `icg monitor`.
scrape_configs:
  - job_name: icg
    metrics_path: /metrics
    scrape_interval: 30s
    scrape_timeout: 10s
    static_configs:
      - targets:
          - icg-monitor:8080
        labels:
          service: irreversible-command-gate
