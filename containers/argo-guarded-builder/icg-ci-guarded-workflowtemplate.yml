apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: icg-ci-guarded
  namespace: argo-workflows
  labels:
    app: icg-ci
spec:
  # Backstop against a run that hangs before its pod ever starts
  activeDeadlineSeconds: 10800
  entrypoint: ci
  serviceAccountName: argo-workflow
  synchronization:
    mutexes:
      - name: icg-ci-mutex
  templates:
    - name: ci
      steps:
        # Keep the Codex compatibility gate ahead of the release-producing stage
        - - name: codex-hook-compatibility
            template: codex-hook-compatibility
            arguments:
              parameters:
                - name: codex-version
                  value: "{{item}}"
            withItems:
              - "0.144.4"
              - "0.145.0"
              - "0.146.0"
        - - name: build-and-release
            template: build-and-release

    - name: codex-hook-compatibility
      activeDeadlineSeconds: 3600
      inputs:
        parameters:
          - name: codex-version
      container:
        # Use guarded builder for Codex compatibility tests
        image: ronaldraygun/argo-guarded-builder:0.1.0
        imagePullPolicy: IfNotPresent
        command: [bash, -c]
        args:
          - |
            set -ex

            echo "=== Codex Compatibility Test with icg Guard ==="
            icg status || true
            echo

            # Install the exact stable Codex CLI version
            CODEX_VERSION="{{inputs.parameters.codex-version}}"
            npm install --global --no-fund --no-audit "@openai/codex@${CODEX_VERSION}"
            test "$(codex --version)" = "codex-cli ${CODEX_VERSION}"
            codex --help >/dev/null

            # Each matrix pod gets a clean checkout and Rust toolchain
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
            . "$HOME/.cargo/env"
            rustc --version
            git clone --depth 1 "https://github.com/jedarden/irreversible-command-gate.git" /workspace
            cd /workspace
            cargo test --locked --test codex_hook_tests

            echo "✅ Codex compatibility test passed"
        env:
          - name: ICG_RULE_PACK
            value: /etc/icg/packs
        resources:
          requests:
            cpu: 1000m
            memory: 2Gi
          limits:
            cpu: 1500m
            memory: 3Gi

    - name: build-and-release
      activeDeadlineSeconds: 3600
      container:
        # SELF-REFERENTIAL PROTECTION: icg's own release pipeline uses the guarded builder
        # This ensures the guard protecting everything else is itself protected
        image: ronaldraygun/argo-guarded-builder:0.1.0
        imagePullPolicy: IfNotPresent
        command: [bash, -c]
        args:
          - |
            set -ex

            echo "=== icg Self-Referential Guarded Build ==="
            icg status || true
            echo

            # Install gh CLI (already in guarded builder, but verify)
            gh --version

            # Rust toolchain is already in guarded builder
            . "$HOME/.cargo/env"
            rustc --version

            # Clone from GitHub mirror (ignore webhook payload)
            echo "=== Cloning repository ==="
            git clone --depth 1 "https://github.com/jedarden/irreversible-command-gate.git" /workspace
            cd /workspace

            COMMIT=$(git rev-parse HEAD)

            # CI checks
            echo "=== Running CI checks ==="
            cargo fmt --all -- --check
            cargo check --all-targets
            cargo clippy --all-targets -- -D warnings
            cargo test

            # Build the merged pack from the ACTUAL packs being released
            # This ensures the gates test what's actually being shipped
            echo "=== Building merged pack from actual packs ==="
            cargo run --quiet -- build-pack --pack-dir packs --output /tmp/current-merged.json

            # Generate deterministic manifest for the actual packs being released
            echo "=== Generating current pack manifest ==="
            cargo run --quiet -- pack-manifest --pack-dir packs --output /tmp/current-manifest.json

            # Download the previous release's merged pack from GitHub Releases
            # This is the trusted baseline - not a static fixture
            echo "=== Fetching previous release pack ==="
            PREVIOUS_VERSION=$(gh release view --repo jedarden/irreversible-command-gate --json tagName --jq '.tagName' | head -1)
            if [ -n "$PREVIOUS_VERSION" ] && [ "$PREVIOUS_VERSION" != "null" ]; then
              echo "Previous release: $PREVIOUS_VERSION"
              # Try to download the previous release's merged pack
              if gh release download "$PREVIOUS_VERSION" --repo jedarden/irreversible-command-gate --pattern rule-pack.json --dir /tmp --clobber 2>/dev/null; then
                PREVIOUS_PACK=/tmp/rule-pack.json
                echo "Using previous pack: $PREVIOUS_PACK"
              else
                echo "⚠️  No previous release pack found - this is the first release or pack was not included"
                # For the first release or when previous pack is missing,
                # we skip regression checks but still verify the current packs
                PREVIOUS_PACK=/tmp/empty-pack.json
                echo '{"id":"empty","tool_keywords":[],"applies_to":[],"safe_patterns":[],"guarded_patterns":[]}' > "$PREVIOUS_PACK"
              fi
            else
              echo "⚠️  No previous release found - this is the first release"
              PREVIOUS_PACK=/tmp/empty-pack.json
              echo '{"id":"empty","tool_keywords":[],"applies_to":[],"safe_patterns":[],"guarded_patterns":[]}' > "$PREVIOUS_PACK"
            fi

            # Generate and validate the fixed deny-must-still-fire suite
            # This now gates the ACTUAL packs being released, not static fixtures
            echo "=== Generating regression suite ==="
            cargo run --quiet -- regression-suite \
              /tmp/current-merged.json \
              --output /tmp/icg-regression-suite.json

            # Compare the previous and current rule-pack manifests
            # This ensures no coverage regressions in the actual release
            echo "=== Checking coverage diffs ==="
            cargo run --quiet -- coverage-diff \
              "$PREVIOUS_PACK" \
              /tmp/current-merged.json

            # Check every released pack for ReDoS (catastrophic backtracking) vulnerabilities
            echo "=== Checking for ReDoS vulnerabilities ==="
            cargo run --quiet -- redos-check \
              /tmp/current-merged.json \
              --timeout-ms 100

            echo "✅ CI passed - actual packs are gated!"

            # Extract version from workspace Cargo.toml
            VERSION=$(grep -A10 '\[workspace.package\]' Cargo.toml | grep '^version' | head -1 | sed 's/.*"\(.*\)".*/\1/')
            echo "Version: ${VERSION}"

            # Tag-to-Forgejo (protected by icg - no force-push allowed)
            echo "=== Creating and pushing tag ==="
            git tag "v${VERSION}" 2>/dev/null || [ "$(git rev-parse "refs/tags/v${VERSION}^{commit}")" = "$(git rev-parse HEAD)" ]
            echo "Pushing tag v${VERSION} to Forgejo"
            set +x
            git push "https://x-token:${FORGEJO_TOKEN}@git.ardenone.com/jedarden/irreversible-command-gate.git" "refs/tags/v${VERSION}"
            set -x

            # Check if release already exists
            IS_DRAFT=$(gh release view "v${VERSION}" --repo jedarden/irreversible-command-gate --json isDraft --jq '.isDraft' 2>/dev/null || echo "absent")
            if [ "$IS_DRAFT" = "false" ]; then
              echo "Release v${VERSION} already published — skipping"
              exit 0
            fi
            if [ "$IS_DRAFT" = "true" ]; then
              echo "Release v${VERSION} exists as a DRAFT — publishing it in place"
              gh release edit "v${VERSION}" --repo jedarden/irreversible-command-gate --draft=false
              echo "Release v${VERSION} published"
              exit 0
            fi

            # Build release binary
            echo "=== Building release binary ==="
            cargo build --release --bin icg

            # Keep the merged artifact for legacy single-file installations,
            # then package every independently-dispatched manifest for the
            # production hook directory. Empty-keyword packs cannot safely be
            # merged without losing their unconditional/content coverage.
            echo "=== Building legacy merged rule-pack artifact ==="
            cargo run --quiet -- build-pack --output /tmp/rule-pack.json

            # Package the modular rule-pack directory that was already gated above
            # The archive must be produced from the exact bytes that passed coverage-diff
            echo "=== Packaging gated modular rule-pack directory ==="
            tar -C /workspace -czf /tmp/icg-packs.tar.gz packs

            # Verify the archive contains the exact bytes that were gated
            echo "=== Verifying archive integrity ==="
            VERIFY_DIR=$(mktemp -d)
            tar -xzf /tmp/icg-packs.tar.gz -C "$VERIFY_DIR"
            cargo run --quiet -- pack-manifest --pack-dir "$VERIFY_DIR/packs" --output /tmp/verify-manifest.json

            # The verified manifest must match the gated manifest exactly
            if ! diff -q /tmp/current-manifest.json /tmp/verify-manifest.json; then
              echo "❌ ARCHIVE VERIFICATION FAILED: Archive bytes do not match gated manifest!"
              echo "This indicates a critical security issue - the archive was not produced from the gated bytes."
              exit 1
            fi
            echo "✅ Archive verified - contains exact gated bytes"

            # Include the pack manifest in the release for verification
            cp /tmp/current-manifest.json /tmp/pack-manifest.json


            # Create GitHub release with binary, compatibility artifact, and
            # the complete production pack directory.
            echo "=== Creating GitHub release ==="
            gh release create "v${VERSION}" \
              --repo jedarden/irreversible-command-gate \
              --title "irreversible-command-gate v${VERSION}" \
              --notes "Release v${VERSION}

            Built from commit: ${COMMIT}

            **Self-Referential Protection**: This release was built using icg PATH-wrapper
            protection in Argo Workflows. The guard protecting everything else is itself
            protected.

            **Release Integrity**: This release was gated against the actual pack bytes
            included in icg-packs.tar.gz, not static fixtures. The pack-manifest.json
            provides cryptographic verification (SHA-256) of all released packs.

            Binaries:
            - icg: Main guard binary (supports: hook, wrapper, and admin subcommands)
            - icg-packs.tar.gz: Complete modular pack directory for production `icg hook`
            - rule-pack.json: Legacy merged compatibility artifact (for legacy `icg update`)
            - pack-manifest.json: Deterministic manifest with SHA-256 hashes of all packs
            " \
              --target main \
              ./target/release/icg \
              /tmp/icg-packs.tar.gz \
              /tmp/rule-pack.json \
              /tmp/pack-manifest.json

            echo "✅ Release v${VERSION} created!"

            # Show denial log if any denials occurred during the build
            if [ -f /var/cache/icg/denials.jsonl ]; then
              echo
              echo "=== Build Denial Log ==="
              cat /var/cache/icg/denials.jsonl || true
            fi
        env:
          - name: GIT_CONFIG_COUNT
            value: "1"
          - name: GIT_CONFIG_KEY_0
            value: credential.helper
          - name: GIT_CONFIG_VALUE_0
            value: '!f() { test "$1" = get && echo "username=x-access-token" && echo "password=$GH_TOKEN"; }; f'
          - name: GH_TOKEN
            valueFrom:
              secretKeyRef:
                name: github-webhook-secret
                key: token
          - name: FORGEJO_TOKEN
            valueFrom:
              secretKeyRef:
                name: forgejo-webhook-token
                key: token
          - name: ICG_RULE_PACK
            value: /etc/icg/packs
        resources:
          requests:
            cpu: 1000m
            memory: 2Gi
          limits:
            cpu: 1500m
            memory: 3Gi
